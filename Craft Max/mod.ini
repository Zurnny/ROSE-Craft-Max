[Mod]
Name=Craft Max
Version=1.7
Author=Zurnny
Group=
Description=Adds a Max button next to the crafting amount. It counts the materials in your bags (and your MP, when the recipe uses MP), sets the amount to as many as you can make and starts crafting. Switch: the Add-ons button in the menu.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Fixes a freeze when ticking a Dropped Items box in the Add-ons window. New: Group Leader colour in Message Colours; Minimap Window's compass ring with its own switch and map turning; Weapon Refresh merged into HUD Weapon Slot; the default UI Add-ons button uses the game's own button look.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-Craft-Max/main/Craft%20Max/manifest.txt
