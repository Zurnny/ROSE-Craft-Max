[Mod]
Name=Craft Max
Version=1.2
Author=Zurnny
Group=
Description=Adds a Max button next to the crafting amount. It counts the materials in your bags (and your MP, when the recipe uses MP), sets the amount to as many as you can make and starts crafting. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Crafting: the first material slot shows its count like the other slots (small, top left), and it no longer shows through the open Type list.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-Craft-Max/main/Craft%20Max/manifest.txt
